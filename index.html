<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";; rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>;

    <style>
        body {
            background-color: #e3b1d2;
            color: white;
            text-align: center;
            padding: 2rem;
        }
        h1, h2, p {
            margin: 0.5rem 0;
        }
        .btn-custom {
            margin: 5px;
        }
    </style>
</head>
<body>


<div class="container">
    <div class="col-md-12">
        <script>
            var weight = 100;
            document.write("<h2>Click the buttons below to convert </h2><h2>" + "<kbd>" + weight + " " + "</kbd>" + "<h2>pesos to other currencies </h2>");
        </script>
    </div>

    <br>

    <div class="col-md-12">
        <p id="display"></p>
    </div>

    <br>

    <button type="button" class="btn btn-primary" onclick="var weight = 58.66; var kilo=1; document.getElementById('display').innerHTML = '<kbd>' + weight * kilo + '</kbd>'">Dollar</button>
    <button type="button" class="btn btn-warning" onclick="var weight = 1.69; var mgram=1; document.getElementById('display').innerHTML = '<kbd>' + weight * mgram + '</kbd>'">Baht</button>

            <button class="btn btn-success btn-custom" onclick="refreshPage()">Refresh</button>

</div>

</body>
</html>
